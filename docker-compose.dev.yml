services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: martyvtc
    volumes:
      - martyvtc_pg_dev:/var/lib/postgresql/data

volumes:
  martyvtc_pg_dev:
